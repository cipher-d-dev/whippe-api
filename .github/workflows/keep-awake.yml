# Render's free plan puts the API to sleep after 15 minutes without requests,
# and the next person waits ~50 seconds (it looks like "the server is down").
# This pings it every 10 minutes during DAAR working hours so it stays awake.
# 05:00–17:59 UTC = 06:00–18:59 in Lagos, Monday to Friday.
# About 1,700 GitHub Actions minutes a month, inside the 2,000 free minutes a
# private repo gets (public repos: unlimited). Render's 750 free hours cover it.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 5-17 * * 1-5"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://whippe-api.onrender.com/health) && echo "status $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not answer with 200"; exit 1
